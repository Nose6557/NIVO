<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{padding:24px}
  .lbl{font:600 13px/1 monospace; color:#8d93a1; margin:28px 0 8px}
  .frame{border:1px dashed #444}
</style>
</head>
<body>

<div class="lbl">ОСНОВНИЙ ТЕСТ — #screen-play</div>
<div class="frame">
<section class="screen active" style="position:static">
  <div class="shell narrow">
    <div class="play-top">
      <div class="progress-rail"><div class="progress-fill" style="width:40%"></div></div>
      <div class="play-meta">
        <span class="mono" id="qcount">7 / 15</span>
        <span class="mono streak">3 правильних поспіль</span>
        <button class="btn ghost small">Вийти</button>
      </div>
    </div>
    <div class="card">
      <p class="cat-tag mono">Часи</p>
      <p class="q-prompt">She ___ to the office every morning before the traffic gets bad.</p>
      <button class="opt">drives</button>
      <button class="opt">is driving</button>
      <button class="opt">drive</button>
      <button class="opt">has driven</button>
      <button class="btn primary" hidden>Далі</button>
    </div>
  </div>
</section>
</div>

<div class="lbl">ТЕСТ РІВНЯ — ПІСЛЯ (нова розмітка = така сама)</div>
<div class="frame">
<section id="screen-onboard" class="screen active testing" style="position:static">
  <div class="shell narrow" id="onboard-body">
      <div class="play-top">
        <div class="progress-rail"><div class="progress-fill" style="width:40%"></div></div>
        <div class="play-meta">
          <span class="mono" id="qcount">7 / 16</span>
          <button class="btn ghost small" id="ob-skip-test">Пропустити тест</button>
        </div>
      </div>
      <div class="card">
        <p class="cat-tag mono">Тест рівня</p>
        <p class="q-prompt">She ___ to the office every morning before the traffic gets bad.</p>
        <button class="opt ob-answer">drives</button>
        <button class="opt ob-answer">is driving</button>
        <button class="opt ob-answer">drive</button>
        <button class="opt ob-answer">has driven</button>
      </div>
  </div>
</section>
</div>

</body>
</html>
